<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joseph Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f5f9;
      color: #172033;
    }

    header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2864e8;
    }

    .search {
      width: 35%;
      padding: 11px 18px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 20px;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .menu button {
      width: 100%;
      border: none;
      background: none;
      text-align: left;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .menu button:hover {
      background: #eef3ff;
      color: #2864e8;
    }

    .composer textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      resize: none;
      outline: none;
    }

    .post-btn {
      background: #2864e8;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .post {
      margin-top: 18px;
    }

    .post-user {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .post-text {
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .actions {
      border-top: 1px solid #eee;
      padding-top: 12px;
      display: flex;
      gap: 25px;
    }

    .actions button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
    }

    .trend {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    @media(max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }

      .left, .right {
        display: none;
      }

      .search {
        width: 50%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Joseph Social</div>
  <input class="search" type="text" placeholder="Search Joseph Social...">
  <div>👤</div>
</header>

<div class="container">

  <aside class="left">
    <div class="card menu">
      <button>🏠 Home</button>
      <button>🔎 Explore</button>
      <button>🎬 Videos</button>
      <button>💬 Messages</button>
      <button>🔔 Notifications</button>
      <button>👤 Profile</button>
      <button>⚙️ Settings</button>
    </div>
  </aside>

  <main>

    <div class="card composer">
      <h3>Create a post</h3>
      <br>
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button class="post-btn" onclick="createPost()">Post</button>
    </div>

    <div id="posts">

      <div class="card post">
        <div class="post-user">Joseph Hbk</div>
        <div class="post-text">
          Welcome to Joseph Social! 🚀
          This is your new social media platform.
        </div>

        <div class="actions">
          <button onclick="likePost(this)">❤️ Like</button>
          <button>💬 Comment</button>
          <button>↗️ Share</button>
        </div>
      </div>

    </div>

  </main>

  <aside class="right">

    <div class="card">
      <h3>🔥 Trending</h3>

      <div class="trend">#JosephSocial</div>
      <div class="trend">#Technology</div>
      <div class="trend">#Music</div>
      <div class="trend">#Zambia</div>
    </div>

    <div class="card">
      <h3>People you may know</h3>
      <br>
      <p>👤 New users coming soon</p>
    </div>

  </aside>

</div>

<script>
  function createPost() {
    const text = document.getElementById("postText").value.trim();

    if (!text) {
      alert("Write something first.");
      return;
    }

    const post = document.createElement("div");
    post.className = "card post";

    post.innerHTML = `
      <div class="post-user">Joseph Hbk</div>
      <div class="post-text">${text}</div>

      <div class="actions">
        <button onclick="likePost(this)">❤️ Like</button>
        <button>💬 Comment</button>
        <button>↗️ Share</button>
      </div>
    `;

    document.getElementById("posts").prepend(post);
    document.getElementById("postText").value = "";
  }

  function likePost(button) {
    if (button.innerHTML.includes("❤️ Like")) {
      button.innerHTML = "💙 Liked";
    } else {
      button.innerHTML = "❤️ Like";
    }
  }
</script>

</body>
</html>
